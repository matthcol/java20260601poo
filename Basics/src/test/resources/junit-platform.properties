### Settings to enable a true concurrency between tests risking
### to do an infinity while loop.
###
### Uncomment them when you want to have a TDD approach while developing
### function Euclide.gcd.
###
### NB: These settings have an impact on the output of the demos handled by JUnit
#junit.jupiter.execution.parallel.enabled=true
#junit.jupiter.execution.parallel.mode.default=concurrent